<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>khatab love</title>
  <style>
    :root {
      --bg: #fff4f1;
      --card: #ffffff;
      --ink: #2b1d24;
      --muted: #7a6670;
      --line: #ecd9d8;
      --accent: #d6336c;
      --accent-dark: #b02456;
      --error: #c0262d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px 32px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(214, 51, 108, 0.12);
    }

    h1 { font-size: 1.9rem; text-align: center; }
    .subtitle { margin: 6px 0 28px; text-align: center; color: var(--muted); }

    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem; }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      font: inherit;
      color: var(--ink);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(214, 51, 108, 0.2);
    }
    input.invalid { border-color: var(--error); }

    button {
      width: 100%;
      padding: 13px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: var(--accent-dark); }
    button:active { transform: scale(0.98); }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

    .error {
      min-height: 1.4em;
      margin-bottom: 12px;
      color: var(--error);
      font-size: 0.9rem;
      text-align: center;
    }

    #result {
      margin-top: 24px;
      padding: 24px 16px;
      text-align: center;
      border-radius: 12px;
      background: #fff0f5;
      color: var(--muted);
      transition: background 0.5s;
    }
    #result.show { animation: pop 0.5s ease; }

    .heart {
      display: block;
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 8px;
    }
    #result.show .heart { animation: beat 0.9s ease 0.4s 2; }

    .meter-label { margin-bottom: 12px; font-weight: 600; color: var(--muted); }
    .ring { position: relative; width: 170px; height: 170px; margin: 0 auto 14px; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 12; }
    .ring .track { stroke: rgba(214, 51, 108, 0.15); }
    .ring .fill {
      stroke: var(--accent);
      stroke-linecap: round;
      stroke-dasharray: 440;
      stroke-dashoffset: 440;
      transition: stroke-dashoffset 1.5s ease-out;
    }
    .ring .center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .ring .heart { font-size: 1.8rem; margin-bottom: 2px; }

    .score { font-size: 2.4rem; font-weight: 700; line-height: 1.1; }
    .names { margin: 4px 0 8px; font-weight: 600; color: var(--ink); }
    .message { color: var(--ink); }

    /* Result colours change with the score */
    #result.low  { background: #eaf2fb; }
    #result.mid  { background: #fff6dd; }
    #result.high { background: #ffe3ec; }

    @keyframes pop {
      0%   { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.3); }
    }
    @media (prefers-reduced-motion: reduce) {
      #result.show, #result.show .heart { animation: none; }
      .ring .fill { transition: none; }
    }
  </style>
</head>
<body>

    <p class="subtitle">Enter your loves 😘💖💖to see how much loves you 💘🌚</p>

    <label for="name1">First name</label>
    <input type="text" id="name1" placeholder="e.g. Sara" autocomplete="off">

    <label for="name2">Second name</label>
    <input type="text" id="name2" placeholder="e.g. Ali" autocomplete="off">

    <p class="error" id="error" role="alert"></p>

    <button id="matchBtn" type="button">Find the match</button>

    <section id="result" aria-live="polite">
      Your result will appear here.
    </section>
  </main>

        '</svg>' +
        '<div class="center"><span class="heart"></span><span class="score">0%</span></div>';

      const scoreEl = ring.querySelector(".score");

      names.textContent = name1 + " & " + name2;

      message.className = "message";
      message.textContent = getMessage(score);

      result.append(label, ring, names, message);

      // Fill the ring and count up to the score
      requestAnimationFrame(() => {
        fill.style.strokeDashoffset = 440 * (1 - score / 100);
      });
